[project]
name = "newline-fixer"
version = "0.1.0"
description = "A service that fixes newline placement in English text"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
data = ["datasets>=3.0", "huggingface_hub>=0.25", "anthropic>=0.40"]
model = ["torch>=2.4,<3", "huggingface_hub>=0.25", "transformers>=4.45,<5", "sentencepiece>=0.2", "protobuf>=4"]  # the hub is also the weights source (hf:)

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newline_fixer"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter owns line layout; long strings are allowed

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["datasets", "datasets.*", "huggingface_hub", "huggingface_hub.*", "transformers", "transformers.*", "tokenizers", "tokenizers.*", "sentencepiece"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
